spring.application.name=ai-lms-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_lms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.security.jwt.secret=${JWT_SECRET:ZGVmYXVsdC1haS1sbXMtanB3LXNlY3JldC1rZXktZm9yLWRldi1vbmx5LTEyMzQ1Njc4OTA=}
app.security.jwt.access-token-validity-minutes=${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:60}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:4174,http://localhost:5173}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:change-me-webhook-secret}
